name: Build NovaFrame APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Artifact cleanup requires actions:write.
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default includes the obsolete `tools` SDK package.
          # Modern SDK repositories no longer provide that package.
          packages: platform-tools

      - name: Install NDK 27.0.12077973 and CMake 3.22.1
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      # GitHub Actions artifact storage was full in the previous run.
      # Remove old artifacts before uploading the new APK so the workflow
      # does not accumulate APKs forever.
      - name: Clean old workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
          while IFS= read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            echo "Deleting artifact: $artifact_id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

      - name: Grant execute permission for gradlew
        working-directory: android-app
        run: chmod +x gradlew

      - name: Decode release keystore (optional)
        if: ${{ env.LSFGA_STORE_FILE_B64 != '' }}
        working-directory: android-app
        env:
          LSFGA_STORE_FILE_B64: ${{ secrets.LSFGA_STORE_FILE_B64 }}
        run: |
          echo "$LSFGA_STORE_FILE_B64" | base64 -d > release.keystore
          {
            echo "LSFGAndroid_STORE_FILE=release.keystore"
            echo "LSFGAndroid_STORE_PASSWORD=${{ secrets.LSFGA_STORE_PASSWORD }}"
            echo "LSFGAndroid_KEY_ALIAS=${{ secrets.LSFGA_KEY_ALIAS }}"
            echo "LSFGAndroid_KEY_PASSWORD=${{ secrets.LSFGA_KEY_PASSWORD }}"
          } >> gradle.properties

      # Maven Central can temporarily return HTTP 429 (Too Many Requests).
      # Retry the Gradle build so transient repository rate limits do not
      # fail the workflow.

      - name: Build release APK
        working-directory: android-app
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Gradle release build attempt ${attempt}/4"
            if ./gradlew :app:assembleRelease --stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      # Keep only the release artifact to reduce storage usage.
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: novaframe-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
