name: Android APK Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p release
          cp "${{ steps.apk.outputs.apk }}" \
             "release/NovaFrame-${GITHUB_REF_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaFrame-${{ github.ref_name }}
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NovaFrame ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
