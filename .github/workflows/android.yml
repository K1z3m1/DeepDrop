name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure Release Keystore exists
      run: |
        if [ ! -f app/release.keystore ]; then
          keytool -genkey -v -keystore app/release.keystore -alias lwbrowser -keyalg RSA -keysize 2048 -validity 10000 -storepass lwbrowser_release -keypass lwbrowser_release -dname "CN=lwBrowser Release, OU=Mobile, O=lw, L=Global, ST=World, C=US"
        else
          echo "Using committed app/release.keystore"
        fi

    - name: Build Release APK with Gradle
      run: ./gradlew assembleStableRelease --no-daemon --stacktrace

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lw-release-apk
        path: app/build/outputs/apk/stable/release/*.apk
        if-no-files-found: error
    
