name: Build Fluxa

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# least privilege by default; only the release job below gets write access
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # refuse a tampered gradle-wrapper.jar
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" "cmake;3.22.1" "build-tools;35.0.1" "platforms;android-36"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Signing secrets are only exposed to the release build on trusted refs (never on pull requests from forks)
      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.FLUXA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FLUXA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Require signing key for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && env.FLUXA_KEYSTORE_FILE == ''
        run: |
          echo "::error::Tagged release needs the FLUXA_KEYSTORE_BASE64 secret; refusing to ship a debug-signed APK."
          exit 1

      - name: Build release APK
        env:
          FLUXA_KEYSTORE_PASSWORD: ${{ secrets.FLUXA_KEYSTORE_PASSWORD }}
          FLUXA_KEY_ALIAS: ${{ secrets.FLUXA_KEY_ALIAS }}
          FLUXA_KEY_PASSWORD: ${{ secrets.FLUXA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release signature and print its fingerprint
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee cert.txt
          {
            echo "### Release signing certificate"
            echo '```'
            grep -E "certificate (SHA-256|SHA-1) digest|Signer #1 certificate DN" cert.txt
            echo '```'
            echo "Publish the SHA-256 value in SECURITY.md so users can compare it in About > Verify this app."
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qi "Android Debug" cert.txt; then echo "::warning::Release APK is signed with the DEBUG key"; fi

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Fluxa-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fluxa-release
          path: app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fluxa-release
          path: release

      - name: Checksums
        run: cd release && sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          generate_release_notes: true
